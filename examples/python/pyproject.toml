[project]
name = "marona-agents-examples"
version = "0.1.0"
description = "Runnable Python examples for Marona Agents."
requires-python = ">=3.11"
dependencies = ["marona==1.0.0"]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "pytest>=8,<9", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marona_agents_examples = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["marona_agents_examples"]
